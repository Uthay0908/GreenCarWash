server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

media:
  storage-path: ${MEDIA_STORAGE_PATH:./media-storage}
