server.port=8086
spring.application.name=washer-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/greencarwash_washer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include=health,info,metrics
