<header class="gcw-header">
  <div class="gcw-container header-inner">
    <a routerLink="/" class="brand" (click)="closeMobileMenu()">
      <div class="brand-hexagon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L21.5 7.5V16.5L12 22L2.5 16.5V7.5L12 2Z" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
          <path d="M12 7C9.5 7 8 9.5 8 12C8 14.5 10 16 12 17C14 16 16 14.5 16 12C16 9.5 14.5 7 12 7Z" fill="#10b981"/>
          <path d="M12 9V15" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">GreenCarWash</span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" [class.open]="mobileMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a>
      <a href="/#about" (click)="closeMobileMenu()">About</a>
      <a href="/#contact" (click)="closeMobileMenu()">Contact</a>

      <div class="location-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Erode, Tamil Nadu</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>

      <div class="nav-auth">
        @if (auth.isAuthenticated()) {
          <a [routerLink]="dashboardLink()" class="gcw-btn gcw-btn-primary gcw-btn-sm" (click)="closeMobileMenu()">
            Book a Wash →
          </a>
          <button type="button" class="gcw-btn gcw-btn-secondary gcw-btn-sm" (click)="logout()">Logout</button>
        } @else {
          <a routerLink="/login" class="nav-login-link" (click)="closeMobileMenu()">Login</a>
          <a routerLink="/register" class="gcw-btn gcw-btn-primary gcw-btn-sm" (click)="closeMobileMenu()">
            Book a Wash →
          </a>
        }
      </div>
    </nav>
  </div>
</header>
