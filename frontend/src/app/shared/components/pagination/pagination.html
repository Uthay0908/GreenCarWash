<div class="pagination-container">
  <div class="pagination-info">
    <span>Showing <strong>{{ startItem() }}</strong>–<strong>{{ endItem() }}</strong> of <strong>{{ totalElements() }}</strong> records</span>
    
    <div class="page-size-selector">
      <label for="pageSizeSelect">Show</label>
      <select id="pageSizeSelect" class="page-size-select" [value]="pageSize()" (change)="onSizeChange($event)">
        @for (opt of pageSizeOptions(); track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
      <span>per page</span>
    </div>
  </div>

  @if (totalPages() > 1) {
    <div class="pagination-controls">
      <button
        type="button"
        class="pagination-btn first-btn"
        [disabled]="currentPage() === 0"
        (click)="goToPage(0)"
        title="First page"
      >
        &laquo;
      </button>

      <button
        type="button"
        class="pagination-btn prev-btn"
        [disabled]="currentPage() === 0"
        (click)="goToPage(currentPage() - 1)"
        title="Previous page"
      >
        &lsaquo;
      </button>

      @for (p of pages(); track $index) {
        @if (p === -1 || p === -2) {
          <span class="pagination-ellipsis">&hellip;</span>
        } @else {
          <button
            type="button"
            class="pagination-btn page-number"
            [class.active]="p === currentPage()"
            (click)="goToPage(p)"
          >
            {{ p + 1 }}
          </button>
        }
      }

      <button
        type="button"
        class="pagination-btn next-btn"
        [disabled]="currentPage() >= totalPages() - 1"
        (click)="goToPage(currentPage() + 1)"
        title="Next page"
      >
        &rsaquo;
      </button>

      <button
        type="button"
        class="pagination-btn last-btn"
        [disabled]="currentPage() >= totalPages() - 1"
        (click)="goToPage(totalPages() - 1)"
        title="Last page"
      >
        &raquo;
      </button>
    </div>
  }
</div>
