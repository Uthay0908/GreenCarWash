<span class="stars" [class.readonly]="readonly()">
  @for (star of stars(); track star) {
    <button
      type="button"
      class="star"
      [class.filled]="star <= rating()"
      [disabled]="readonly()"
      (click)="select(star)"
      [attr.aria-label]="star + ' star'"
    >★</button>
  }
</span>
