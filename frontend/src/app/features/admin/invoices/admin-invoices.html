<div class="gcw-page-header">
  <div>
    <h1>Invoices</h1>
    <p>Platform-wide invoice records.</p>
  </div>
</div>

<div class="gcw-card">
  <div class="gcw-table-wrap">
    <table class="gcw-table">
      <thead>
        <tr><th>Invoice #</th><th>Booking</th><th>Date</th><th>Amount</th><th>Status</th></tr>
      </thead>
      <tbody>
        @for (inv of invoices(); track inv.id) {
          <tr>
            <td><strong>{{ inv.invoiceNumber }}</strong></td>
            <td>#{{ inv.bookingId }}</td>
            <td>{{ inv.issuedAt | date: 'mediumDate' }}</td>
            <td>${{ (inv.totalAmount || 0).toFixed(2) }}</td>
            <td><app-status-badge [status]="inv.refundStatus || 'ISSUED'" /></td>
          </tr>
        } @empty {
          <tr><td colspan="5" style="text-align: center; padding: 2rem; color: #64748b;">No invoices generated yet.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
